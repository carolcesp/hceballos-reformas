<header class="fixed top-0 w-full z-50 bg-black/80 backdrop-blur-xl border-b border-white/5 shadow-lg shadow-black/20">
  <nav class="flex justify-between items-center w-full px-6 py-4 max-w-7xl mx-auto">
    <a routerLink="/" class="flex items-center gap-3 cursor-pointer">
      <img alt="Logo HCeballos" class="h-14 w-auto" src="/logo-hceballos.png" />
      <span class="text-2xl font-extrabold tracking-tighter font-headline text-corporate-blue">HCeballos</span>
    </a>

    <div class="hidden md:flex gap-8 items-center">
      <a class="font-headline font-semibold tracking-tight transition-colors border-b-2 pb-1 border-transparent text-white/60 hover:text-white"
        routerLink="/" [routerLinkActiveOptions]="{exact: true}"
        routerLinkActive="!text-secondary !border-secondary">Inicio</a>
      <a class="font-headline font-semibold tracking-tight transition-colors border-b-2 pb-1 border-transparent text-white/60 hover:text-white"
        routerLink="/galeria" routerLinkActive="!text-secondary !border-secondary">Galería</a>
      <a class="font-headline font-semibold tracking-tight transition-colors border-b-2 pb-1 border-transparent text-white/60 hover:text-white"
        routerLink="/contacto" routerLinkActive="!text-secondary !border-secondary">Contacto</a>
    </div>

    <div class="flex items-center gap-4">
      <button class="md:hidden p-2 text-white hover:bg-white/10 rounded-lg" (click)="toggleMenu()">
        <span class="material-symbols-outlined">{{ mobileMenuOpen ? 'close' : 'menu' }}</span>
      </button>
    </div>
  </nav>

  <!-- Mobile Menu -->
  <div *ngIf="mobileMenuOpen"
    class="md:hidden absolute top-full left-0 w-full bg-black/95 backdrop-blur-xl border-b border-white/5 shadow-xl flex flex-col px-6 py-4 gap-4">
    <a class="font-headline font-semibold text-lg text-white/80 hover:text-white transition-colors" routerLink="/"
      [routerLinkActiveOptions]="{exact: true}" routerLinkActive="!text-secondary" (click)="toggleMenu()">Inicio</a>
    <a class="font-headline font-semibold text-lg text-white/80 hover:text-white transition-colors"
      routerLink="/galeria" routerLinkActive="!text-secondary" (click)="toggleMenu()">Galería</a>
    <a class="font-headline font-semibold text-lg text-white/80 hover:text-white transition-colors"
      routerLink="/contacto" routerLinkActive="!text-secondary" (click)="toggleMenu()">Contacto</a>
  </div>
</header>
