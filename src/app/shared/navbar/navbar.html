<header class="fixed top-0 w-full z-50 bg-white/80 dark:bg-slate-950/80 backdrop-blur-xl border-b border-slate-100 dark:border-slate-900 shadow-sm dark:shadow-none">
  <nav class="flex justify-between items-center w-full px-6 py-4 max-w-7xl mx-auto">
    <div class="flex items-center gap-3">
      <img alt="Logo HCeballos" class="h-10 w-auto" src="/logo.png"/>
      <span class="text-2xl font-extrabold tracking-tighter text-blue-700 dark:text-blue-500 font-headline">HCeballos</span>
    </div>
    
    <div class="hidden md:flex gap-8 items-center">
      <a class="font-headline font-semibold tracking-tight text-blue-700 dark:text-blue-400 border-b-2 border-blue-700 dark:border-blue-400 pb-1" href="/">Inicio</a>
      <a class="font-headline font-semibold tracking-tight text-slate-600 dark:text-slate-400 hover:text-blue-600 dark:hover:text-blue-300 transition-colors" href="/servicios">Servicios</a>
      <a class="font-headline font-semibold tracking-tight text-slate-600 dark:text-slate-400 hover:text-blue-600 dark:hover:text-blue-300 transition-colors" href="/galeria">Galería</a>
    </div>

    <div class="flex items-center gap-4">
      <div class="hidden sm:flex bg-surface-container-high rounded-full p-1 items-center gap-1">
        <span class="px-2 py-0.5 text-[10px] font-bold tracking-widest bg-surface-container-lowest rounded-full text-primary">ES</span>
        <span class="px-2 py-0.5 text-[10px] font-bold tracking-widest text-outline">EN</span>
      </div>
      <button class="md:hidden p-2 text-primary hover:bg-slate-50 rounded-lg" (click)="toggleMenu()">
        <span class="material-symbols-outlined">menu</span>
      </button>
    </div>
  </nav>
</header>
